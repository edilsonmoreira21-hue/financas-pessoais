<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finanças Pessoais</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="icon" href="icone-192.png">
<style>
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface-2:#f0f2f7; --border:#e2e5ee;
  --text:#1c2033; --muted:#6b7288;
  --brand:#4f46e5; --brand-soft:#eef0ff;
  --green:#12a678; --green-soft:#e4f7f1;
  --red:#e0475f; --red-soft:#fdeaee;
  --amber:#e29317;
  --shadow:0 1px 2px rgba(20,25,50,.05), 0 6px 20px rgba(20,25,50,.06);
  --radius:14px;
  --ctrl-h:40px;
}
html[data-theme="dark"]{
  --bg:#111420; --surface:#191d2c; --surface-2:#212639; --border:#2c3247;
  --text:#e8eaf2; --muted:#949cb5;
  --brand:#7b76f1; --brand-soft:#242a4d;
  --green:#2bc79a; --green-soft:#15302a;
  --red:#f4697f; --red-soft:#33202a;
  --amber:#f0ac3c;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
a{color:var(--brand)}

/* ---------- layout ---------- */
.app{max-width:1180px;margin:0 auto;padding:0 18px 60px}
header.top{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding:18px 0 12px;border-bottom:1px solid var(--border);margin-bottom:22px;
}
.top-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.02em}
.logo .mark{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--brand),#8b5cf6);color:#fff;font-size:16px
}
.spacer{flex:1}
.mes-nav{display:flex;align-items:center;gap:6px}
.mes-nav select{width:auto;min-width:160px;font-weight:550;cursor:pointer}
.mes-nav .btn{font-size:16px;color:var(--muted);padding:0 12px}
.mes-nav .btn:hover{color:var(--text)}
#pillSync{color:var(--muted);font-size:15px}
#pillSync.ok{color:var(--green)} #pillSync.pend{color:var(--amber)} #pillSync.erro{color:var(--red)}
.sync-status{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:14px}

/* ---------- tela de entrada ---------- */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.login{width:min(400px,100%)}
.login .marca{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:26px;text-align:center}
.login .marca .mark{width:60px;height:60px;border-radius:17px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--brand),#8b5cf6);color:#fff;font-size:28px}
.login h1{font-size:23px;letter-spacing:-.02em}
.login .sub{color:var(--muted);font-size:14px;margin-top:5px}
.login .card{display:grid;gap:14px}
.login .acoes{display:grid;gap:9px;margin-top:4px}
.login .btn{width:100%;justify-content:center;padding:11px}
.login .erro{background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 12px;font-size:13.5px}
.login .aviso{background:var(--brand-soft);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.login .rodape{text-align:center;font-size:12.5px;color:var(--muted);margin-top:18px;line-height:1.6}
/* altura única para todos os controles do cabeçalho */
header.top .btn,
header.top select{
  height:var(--ctrl-h);
  display:inline-flex;align-items:center;justify-content:center;
  padding-top:0;padding-bottom:0;line-height:1;
}
@media(max-width:560px){
  .top-row{gap:8px}
  .logo{width:100%;font-size:16px}
  header.top .mes-nav{flex:1 1 auto;min-width:0}
  header.top #mesRef{flex:1 1 auto;min-width:0;padding-left:8px;padding-right:6px}
  header.top #btnNew{padding-left:12px;padding-right:12px}
  .app{padding:0 14px 50px}
  .kpi .value{font-size:23px}
}
nav.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  border:0;background:transparent;color:var(--muted);cursor:pointer;
  padding:8px 14px;border-radius:9px;white-space:nowrap;font-weight:550
}
nav.tabs button:hover{background:var(--surface-2);color:var(--text)}
nav.tabs button.active{background:var(--brand);color:#fff}

/* ---------- controls ---------- */
.btn{
  border:1px solid var(--border);background:var(--surface);border-radius:10px;
  padding:8px 14px;cursor:pointer;font-weight:550;transition:.15s;white-space:nowrap
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--red)}
input,select,textarea{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:9px 11px;width:100%;outline:none;transition:.15s
}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
label.field{display:block}
label.field > span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:550}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h3{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:14px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.kpi .label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.kpi .value{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:8px}
.kpi .foot{font-size:12.5px;color:var(--muted);margin-top:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.pos{color:var(--green)} .neg{color:var(--red)}
.charts{grid-template-columns:1.35fr 1fr}
@media(max-width:860px){.charts{grid-template-columns:1fr}}
.cols-2{grid-template-columns:1fr 1fr}
@media(max-width:860px){.cols-2{grid-template-columns:1fr}}
canvas{width:100%;display:block}

/* ---------- legend / lists ---------- */
.legend{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.legend .row{display:flex;align-items:center;gap:9px;font-size:13.5px}
.legend .row b{margin-left:auto;font-weight:600}
.legend .pct{color:var(--muted);width:44px;text-align:right;font-size:12.5px}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:0}
.item .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:none}
.item .txt{min-width:0;flex:1}
.item .txt .t{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .txt .s{font-size:12.5px;color:var(--muted)}
.item .amt{font-weight:650;white-space:nowrap}

/* ---------- table ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:0 10px 10px}
td{padding:11px 10px;border-top:1px solid var(--border);vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:550;background:var(--surface-2);color:var(--muted)}
.tag.in{background:var(--green-soft);color:var(--green)}
.tag.out{background:var(--red-soft);color:var(--red)}

/* ---------- progress ---------- */
.bar{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:6px;background:var(--brand);transition:width .4s}
.budget-row{padding:14px 0;border-bottom:1px solid var(--border)}
.budget-row:last-child{border-bottom:0}
.budget-head{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:14px}
.budget-head b{font-weight:600}
.budget-head .vals{margin-left:auto;color:var(--muted);font-size:13px}

/* ---------- misc ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.toolbar > *{flex:0 0 auto}
.toolbar .grow{flex:1 1 180px;min-width:150px}
.empty{text-align:center;padding:44px 16px;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:10px}
dialog{
  border:1px solid var(--border);border-radius:16px;background:var(--surface);color:var(--text);
  padding:0;width:min(520px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.28)
}
dialog::backdrop{background:rgba(10,12,25,.55);backdrop-filter:blur(2px)}
.dlg-head{display:flex;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border)}
.dlg-body{padding:20px;display:grid;gap:14px}
.dlg-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on[data-v="despesa"]{background:var(--red);color:#fff}
.seg button.on[data-v="receita"]{background:var(--green);color:#fff}
.hint{font-size:12.5px;color:var(--muted)}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--bg);padding:11px 18px;border-radius:11px;font-weight:550;
  opacity:0;pointer-events:none;transition:.25s;z-index:100
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:7px;background:var(--surface-2);border-radius:20px;padding:5px 6px 5px 12px;font-size:13px}
.chip button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;border-radius:50%}
.chip button:hover{color:var(--red)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="logo"><span class="mark">◎</span> Finanças Pessoais</div>
      <div class="spacer"></div>
      <div class="mes-nav">
        <button class="btn sm" id="mesPrev" title="Mês anterior" aria-label="Mês anterior">‹</button>
        <select id="mesRef" aria-label="Mês de referência"></select>
        <button class="btn sm" id="mesNext" title="Próximo mês" aria-label="Próximo mês">›</button>
      </div>
      <button class="btn" id="pillSync" title="Sincronização">☁</button>
      <button class="btn" id="btnTheme" title="Alternar tema">🌙</button>
      <button class="btn primary" id="btnNew">+ Lançamento</button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-view="dashboard" class="active">Painel</button>
      <button data-view="lancamentos">Lançamentos</button>
      <button data-view="orcamentos">Orçamentos</button>
      <button data-view="dividas">Dívidas</button>
      <button data-view="metas">Metas</button>
      <button data-view="config">Configurações</button>
    </nav>
  </header>
  <main id="view"></main>
</div>

<dialog id="dlgTx">
  <form method="dialog" id="formTx">
    <div class="dlg-head"><h2 style="font-size:17px" id="dlgTxTitle">Novo lançamento</h2></div>
    <div class="dlg-body">
      <input type="hidden" name="id">
      <div class="seg" id="segTipo">
        <button type="button" data-v="despesa" class="on">Despesa</button>
        <button type="button" data-v="receita">Receita</button>
      </div>
      <div class="row-2">
        <label class="field"><span>Valor (R$)</span><input name="valor" type="number" step="0.01" min="0" required placeholder="0,00"></label>
        <label class="field"><span>Data</span><input name="data" type="date" required></label>
      </div>
      <label class="field"><span>Descrição</span><input name="descricao" placeholder="Ex.: Mercado do mês" required></label>
      <div class="row-2">
        <label class="field"><span>Categoria</span><select name="categoria" id="selCategoria"></select></label>
        <label class="field"><span>Conta / método</span><select name="conta" id="selConta"></select></label>
      </div>
      <label style="display:flex;align-items:center;gap:9px;font-size:14px">
        <input type="checkbox" name="fixo" style="width:auto"> Lançamento fixo (repete todo mês)
      </label>
    </div>
    <div class="dlg-foot">
      <button class="btn" value="cancel" type="submit" formnovalidate>Cancelar</button>
      <button class="btn primary" value="ok" type="submit">Salvar</button>
    </div>
  </form>
</dialog>

<dialog id="dlgDivida">
  <form method="dialog" id="formDivida">
    <div class="dlg-head"><h2 style="font-size:17px" id="dlgDividaTitulo">Nova dívida</h2></div>
    <div class="dlg-body">
      <input type="hidden" name="id">
      <div class="row-2">
        <label class="field"><span>Descrição</span><input name="nome" required placeholder="Ex.: Financiamento do carro"></label>
        <label class="field"><span>Instituição</span><input name="credor" placeholder="Ex.: Banco X"></label>
      </div>
      <div class="row-2">
        <label class="field"><span>Valor da parcela (R$)</span><input name="parcela" type="number" step="0.01" min="0" required placeholder="0,00"></label>
        <label class="field"><span>Próxima parcela vence em</span><input name="proxima" type="date" required></label>
      </div>
      <div class="row-2">
        <label class="field"><span>Parcela atual</span><input name="atual" type="number" min="1" step="1" required placeholder="13"></label>
        <label class="field"><span>Total de parcelas</span><input name="total" type="number" min="1" step="1" required placeholder="60"></label>
      </div>
      <div class="hint">A parcela atual é a próxima a pagar. Se já pagou 12 de 60, informe 13 e 60.</div>
      <label style="display:flex;align-items:center;gap:9px;font-size:14px">
        <input type="checkbox" name="lancar" style="width:auto" checked> Lançar a despesa automaticamente ao registrar pagamento
      </label>
    </div>
    <div class="dlg-foot">
      <button class="btn" value="cancel" type="submit" formnovalidate>Cancelar</button>
      <button class="btn primary" value="ok" type="submit">Salvar</button>
    </div>
  </form>
</dialog>

<dialog id="dlgMeta">
  <form method="dialog" id="formMeta">
    <div class="dlg-head"><h2 style="font-size:17px">Nova meta</h2></div>
    <div class="dlg-body">
      <input type="hidden" name="id">
      <label class="field"><span>Nome da meta</span><input name="nome" required placeholder="Ex.: Reserva de emergência"></label>
      <div class="row-2">
        <label class="field"><span>Valor alvo (R$)</span><input name="alvo" type="number" step="0.01" min="0" required></label>
        <label class="field"><span>Já guardado (R$)</span><input name="atual" type="number" step="0.01" min="0" value="0"></label>
      </div>
      <label class="field"><span>Prazo (opcional)</span><input name="prazo" type="date"></label>
    </div>
    <div class="dlg-foot">
      <button class="btn" value="cancel" type="submit" formnovalidate>Cancelar</button>
      <button class="btn primary" value="ok" type="submit">Salvar</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>
<script>
/* ============================ configuração do projeto ============================ */
/* A chave publishable é feita para viver no navegador: quem protege os dados é o RLS
   do banco (cada conta só enxerga as próprias linhas). Trocar a chave: ./configurar-chave.sh */
const SUPABASE = {
  url: 'https://npooxxzrcalmvqodtydt.supabase.co',
  key: '__CHAVE_PUBLISHABLE__' // chave publishable
};

/* ============================ estado ============================ */
const KEY = 'financas-pessoais-v1';
const PALETTE = ['#4f46e5','#12a678','#e29317','#e0475f','#0ea5e9','#8b5cf6','#f472b6','#14b8a6','#f97316','#64748b'];
const ICON = {
  'Moradia':'🏠','Alimentação':'🍽️','Transporte':'🚗','Saúde':'💊','Educação':'📚','Lazer':'🎬',
  'Compras':'🛍️','Assinaturas':'📺','Contas':'🧾','Pets':'🐾','Outros':'📦',
  'Salário':'💼','Freelance':'💻','Investimentos':'📈','Vendas':'🏷️','Presente':'🎁','Reembolso':'↩️'
};
const DEFAULTS = {
  tx: [],
  budgets: [],
  goals: [],
  dividas: [],
  prefsAt: '',
  cats: {
    despesa: ['Moradia','Alimentação','Transporte','Saúde','Educação','Lazer','Compras','Assinaturas','Contas','Outros'],
    receita: ['Salário','Freelance','Investimentos','Vendas','Presente','Outros']
  },
  contas: ['Conta corrente','Dinheiro','Cartão de crédito','Poupança','Pix'],
  theme: 'light'
};

let S = load();
let view = 'dashboard';
let mes = todayISO().slice(0,7);
let filtros = { tipo:'', categoria:'', busca:'', todos:false };

function load(){
  try{
    const raw = JSON.parse(localStorage.getItem(KEY) || '{}');
    return normalizar(Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), raw));
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULTS)); }
}
/* aceita backups do formato antigo e carimba tudo para a sincronização */
function normalizar(st){
  if(st.budgets && !Array.isArray(st.budgets)){
    st.budgets = Object.entries(st.budgets).map(([categoria,limite])=>({categoria, limite:+limite}));
  }
  ['tx','goals','budgets','dividas'].forEach(k=>{
    (st[k]||[]).forEach(r=>{
      if(r.deletado===undefined) r.deletado=false;
      if(!r.atualizado_em){ r.atualizado_em=agora(); r._d=true; }
    });
  });
  return st;
}
let avisouStorage=false;
function save(){ save0(); agendarSync(); }
function save0(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){
    if(!avisouStorage){ avisouStorage=true;
      setTimeout(()=>toast('Não foi possível salvar neste contexto — abra o arquivo direto no navegador'),400); }
  }
}

/* ============================ utilidades ============================ */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = ()=> (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Math.random().toString(36).slice(2,10)+Date.now().toString(36));
function todayISO(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
const BRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const fmt = v => BRL.format(v||0);
const fmtShort = v => Math.abs(v)>=1000 ? (v/1000).toFixed(v%1000===0?0:1).replace('.',',')+'k' : String(Math.round(v));
function mesLabel(ym){
  const [a,m]=ym.split('-');
  const nomes=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return nomes[+m-1]+'/'+a.slice(2);
}
function mesLongo(ym){
  const [a,m]=ym.split('-');
  const nomes=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return nomes[+m-1]+' de '+a;
}
function addMes(ym,n){
  let [a,m]=ym.split('-').map(Number);
  const d=new Date(a,m-1+n,1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function dataBR(iso){ const [a,m,d]=iso.split('-'); return `${d}/${m}/${a.slice(2)}`; }
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function corCat(cat){
  const all=[...S.cats.despesa,...S.cats.receita];
  const i=Math.max(0, all.indexOf(cat));
  return PALETTE[i % PALETTE.length];
}
let toastT;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200);
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ============================ seletores de dados ============================ */
const agora = () => new Date().toISOString();
const TX    = () => S.tx.filter(t=>!t.deletado);
const METAS = () => S.goals.filter(g=>!g.deletado);
const ORCS  = () => S.budgets.filter(b=>!b.deletado && +b.limite>0).map(b=>[b.categoria, +b.limite]);
function limiteDe(cat){ const b=S.budgets.find(x=>x.categoria===cat && !x.deletado); return b ? +b.limite : 0; }
function setLimite(cat, v){
  let b=S.budgets.find(x=>x.categoria===cat);
  if(!b){ b={categoria:cat, limite:0}; S.budgets.push(b); }
  b.limite=v; b.deletado = !(v>0); b.atualizado_em=agora(); b._d=true;
}
const DIVIDAS = () => S.dividas.filter(d=>!d.deletado);
const doMes  = ym => TX().filter(t => t.data.slice(0,7) === ym);

/* soma n meses a uma data ISO, respeitando meses curtos (31/01 + 1 mês = 28/02) */
function dataMaisMeses(iso, n){
  const [a,m,d] = iso.split('-').map(Number);
  const ultimo = new Date(a, m-1+n+1, 0).getDate();
  const alvo = new Date(a, m-1+n, Math.min(d, ultimo));
  return alvo.getFullYear()+'-'+String(alvo.getMonth()+1).padStart(2,'0')+'-'+String(alvo.getDate()).padStart(2,'0');
}
/* tudo o que se calcula a partir de uma dívida */
function contasDivida(d){
  const total = +d.total || 0, atual = +d.atual || 1, valor = +d.parcela || 0;
  const quitada = atual > total;
  const restantes = Math.max(0, total - atual + 1);
  const pagas = Math.min(total, atual - 1);
  return {
    total, atual, valor, quitada, restantes, pagas,
    pago: pagas * valor,
    saldo: restantes * valor,
    contratado: total * valor,
    pct: total ? (pagas / total * 100) : 0,
    ultima: quitada ? null : dataMaisMeses(d.proxima, restantes - 1)
  };
}
const soma   = arr => arr.reduce((s,t)=>s+(+t.valor||0),0);
const receitas = ym => soma(doMes(ym).filter(t=>t.tipo==='receita'));
const despesas = ym => soma(doMes(ym).filter(t=>t.tipo==='despesa'));
function saldoAcumulado(ateYm){
  return TX().filter(t=>t.data.slice(0,7)<=ateYm)
             .reduce((s,t)=>s + (t.tipo==='receita' ? +t.valor : -t.valor), 0);
}
function porCategoria(ym, tipo='despesa'){
  const map={};
  doMes(ym).filter(t=>t.tipo===tipo).forEach(t=>{ map[t.categoria]=(map[t.categoria]||0)+(+t.valor||0); });
  return Object.entries(map).map(([label,value])=>({label,value,color:corCat(label)}))
              .sort((a,b)=>b.value-a.value);
}
function ultimosMeses(n, ate=mes){
  const out=[]; for(let i=n-1;i>=0;i--) out.push(addMes(ate,-i)); return out;
}

/* ============================ gráficos (canvas puro) ============================ */
function ctx2d(cv){
  const dpr=window.devicePixelRatio||1, r=cv.getBoundingClientRect();
  cv.width=Math.max(1,r.width*dpr); cv.height=Math.max(1,r.height*dpr);
  const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  return {c, w:r.width, h:r.height};
}
function donut(cv, dados){
  const {c,w,h}=ctx2d(cv); c.clearRect(0,0,w,h);
  const total=dados.reduce((s,d)=>s+d.value,0);
  const cx=w/2, cy=h/2, R=Math.min(w,h)/2-6, r=R*0.62;
  if(!total){
    c.strokeStyle=css('--border'); c.lineWidth=R-r;
    c.beginPath(); c.arc(cx,cy,(R+r)/2,0,Math.PI*2); c.stroke();
    c.fillStyle=css('--muted'); c.font='500 13px sans-serif'; c.textAlign='center';
    c.fillText('sem dados',cx,cy+4); return;
  }
  let ang=-Math.PI/2;
  dados.forEach(d=>{
    const a=d.value/total*Math.PI*2;
    c.beginPath(); c.moveTo(cx,cy); c.arc(cx,cy,R,ang,ang+a); c.closePath();
    c.fillStyle=d.color; c.fill();
    ang+=a;
  });
  c.globalCompositeOperation='destination-out';
  c.beginPath(); c.arc(cx,cy,r,0,Math.PI*2); c.fill();
  c.globalCompositeOperation='source-over';
  c.fillStyle=css('--muted'); c.textAlign='center'; c.font='500 11.5px sans-serif';
  c.fillText('TOTAL', cx, cy-8);
  c.fillStyle=css('--text'); c.font='700 17px sans-serif';
  c.fillText(fmt(total), cx, cy+13);
}
function eixoY(c,w,h,pad,max,min=0){
  c.strokeStyle=css('--border'); c.fillStyle=css('--muted');
  c.font='500 11px sans-serif'; c.textAlign='right'; c.lineWidth=1;
  for(let i=0;i<=4;i++){
    const v=min+(max-min)*i/4, y=h-pad.b-(h-pad.t-pad.b)*i/4;
    c.beginPath(); c.moveTo(pad.l,y+.5); c.lineTo(w-pad.r,y+.5); c.stroke();
    c.fillText(fmtShort(v), pad.l-8, y+4);
  }
}
function barras(cv, meses){
  const {c,w,h}=ctx2d(cv); c.clearRect(0,0,w,h);
  const pad={t:14,r:8,b:26,l:46};
  const dados=meses.map(m=>({m, r:receitas(m), d:despesas(m)}));
  const max=Math.max(100, Math.max(...dados.flatMap(d=>[d.r,d.d]))*1.15);
  eixoY(c,w,h,pad,max);
  const iw=(w-pad.l-pad.r)/dados.length, bw=Math.min(20,iw*0.3);
  dados.forEach((d,i)=>{
    const x=pad.l+iw*i+iw/2, base=h-pad.b, hh=h-pad.t-pad.b;
    [[d.r,css('--green'),-bw-2],[d.d,css('--red'),2]].forEach(([v,col,off])=>{
      const bh=Math.max(v>0?2:0, v/max*hh);
      c.fillStyle=col;
      c.beginPath(); c.roundRect(x+off, base-bh, bw, bh, [4,4,0,0]); c.fill();
    });
    c.fillStyle=css('--muted'); c.font='500 11px sans-serif'; c.textAlign='center';
    c.fillText(mesLabel(d.m), x, h-8);
  });
}
function linha(cv, meses){
  const {c,w,h}=ctx2d(cv); c.clearRect(0,0,w,h);
  const pad={t:14,r:10,b:26,l:46};
  const vals=meses.map(m=>saldoAcumulado(m));
  const max=Math.max(Math.max(...vals,0)*1.1,100), min=Math.min(...vals,0)*1.1;
  eixoY(c,w,h,pad,max,min);
  const iw=(w-pad.l-pad.r)/Math.max(1,meses.length-1);
  const px=i=>pad.l+iw*i;
  const py=v=>h-pad.b-((v-min)/(max-min||1))*(h-pad.t-pad.b);
  const g=c.createLinearGradient(0,pad.t,0,h-pad.b);
  g.addColorStop(0, css('--brand')+'55'); g.addColorStop(1, css('--brand')+'00');
  c.beginPath(); c.moveTo(px(0),py(vals[0]));
  vals.forEach((v,i)=>c.lineTo(px(i),py(v)));
  c.lineTo(px(vals.length-1),h-pad.b); c.lineTo(px(0),h-pad.b); c.closePath();
  c.fillStyle=g; c.fill();
  c.beginPath(); vals.forEach((v,i)=> i?c.lineTo(px(i),py(v)):c.moveTo(px(i),py(v)));
  c.strokeStyle=css('--brand'); c.lineWidth=2.5; c.lineJoin='round'; c.stroke();
  vals.forEach((v,i)=>{
    c.beginPath(); c.arc(px(i),py(v),3.5,0,Math.PI*2);
    c.fillStyle=css('--surface'); c.fill(); c.strokeStyle=css('--brand'); c.lineWidth=2; c.stroke();
  });
  c.fillStyle=css('--muted'); c.font='500 11px sans-serif'; c.textAlign='center';
  meses.forEach((m,i)=>{ if(meses.length<=8 || i%2===0) c.fillText(mesLabel(m), px(i), h-8); });
}

function render(){
  const logado = SB.ligado();
  $('header.top').style.display = logado ? '' : 'none';
  if(!logado){
    $('#view').innerHTML = telaLogin();
    eventosLogin();
    return;
  }
  $$('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
  popularMeses();
  const el=$('#view');
  el.innerHTML = ({dashboard:vDashboard, lancamentos:vLancamentos, orcamentos:vOrcamentos, dividas:vDividas, metas:vMetas, config:vConfig})[view]();
  ligarEventos();
  if(view==='dashboard'){
    requestAnimationFrame(()=>{
      // a view pode ter mudado antes deste quadro: só desenha se os canvas ainda existem
      const cb=$('#cBarras'), cd=$('#cDonut'), cl=$('#cLinha');
      if(cb) barras(cb, ultimosMeses(6));
      if(cd) donut(cd, porCategoria(mes,'despesa'));
      if(cl) linha(cl, ultimosMeses(12));
    });
  }
}

function eventosLogin(){
  const erro = msg => { $('#loginErro').innerHTML = msg ? `<div class="erro">${esc(msg)}</div>` : ''; };
  const autenticar = async criar => {
    const em = $('#loginEmail').value.trim(), se = $('#loginSenha').value;
    if(!em || !se) return erro('Informe e-mail e senha.');
    const alvo = criar ? $('#loginCriar') : $('#loginEntrar');
    const rotulo = alvo.textContent;
    erro(''); alvo.disabled = true; alvo.textContent = 'Aguarde...';
    try{
      await sbEntrar(em, se, criar);
      render();
      toast(criar ? 'Conta criada' : 'Bem-vindo de volta');
    }catch(e){
      const m = /invalid login/i.test(e.message) ? 'E-mail ou senha incorretos.'
              : /already registered/i.test(e.message) ? 'Este e-mail já tem conta — use Entrar.'
              : /confirme/i.test(e.message) ? 'Confirme o e-mail que o Supabase enviou e depois use Entrar.'
              : /password/i.test(e.message) ? 'A senha precisa de pelo menos 6 caracteres.'
              : e.message;
      erro(m);
      alvo.disabled = false; alvo.textContent = rotulo;
    }
  };
  $('#loginEntrar').onclick = () => autenticar(false);
  $('#loginCriar').onclick  = () => autenticar(true);
  $('#loginSenha').onkeydown = e => { if(e.key === 'Enter') autenticar(false); };
  $('#loginEmail').onkeydown = e => { if(e.key === 'Enter') $('#loginSenha').focus(); };
  const em = $('#loginEmail');
  if(em && !em.disabled){ em.value = localStorage.getItem('sb-email') || ''; (em.value ? $('#loginSenha') : em).focus(); }
}

function popularMeses(){
  const hoje = todayISO().slice(0,7);
  const datas = TX().map(t=>t.data.slice(0,7));
  const ini = [...datas, addMes(hoje,-11), mes].sort()[0];
  const fim = [...datas, addMes(hoje,1), mes].sort().pop();
  const opts=[];
  for(let m=ini; m<=fim && opts.length<600; m=addMes(m,1)) opts.push(m);
  $('#mesRef').innerHTML = opts.reverse().map(m=>{
    const saldo = receitas(m)-despesas(m);
    const extra = m===hoje ? ' · mês atual' : (datas.includes(m) ? ' · '+fmt(saldo) : '');
    return `<option value="${m}" ${m===mes?'selected':''}>${mesLongo(m)}${extra}</option>`;
  }).join('');
}

  return `<div class="item">

      <div class="t">${esc(t.descricao)}${t.fixo?' <span class="tag">fixo</span>':''}</div>
      <div class="s">${esc(t.categoria)} · ${dataBR(t.data)}${t.conta?' · '+esc(t.conta):''}</div>
    </div>
    <div class="amt ${inc?'pos':'neg'}">${inc?'+':'−'} ${fmt(t.valor).replace('R$','R$')}</div>
  </div>`;
}

function budgetRow(cat, lim){
  const gasto = soma(doMes(mes).filter(t=>t.tipo==='despesa' && t.categoria===cat));
  const pct = lim>0 ? gasto/lim*100 : 0;
  const cor = pct>100 ? 'var(--red)' : pct>=80 ? 'var(--amber)' : 'var(--green)';
  return `<div class="budget-row">
    <div class="budget-head">
      <span>${ICON[cat]||'📦'}</span><b>${esc(cat)}</b>
      <span class="vals">${fmt(gasto)} de ${fmt(lim)}</span>
    </div>
    <div class="bar"><i style="width:${Math.min(100,pct)}%;background:${cor}"></i></div>
    <div class="hint" style="margin-top:6px">
      ${pct>100 ? `<span class="neg">Estourou ${fmt(gasto-lim)} (${pct.toFixed(0)}%)</span>`
                : `Restam ${fmt(lim-gasto)} · ${pct.toFixed(0)}% usado`}
    </div>
  </div>`;
}

          <div class="bar"><i style="width:${totalLim?Math.min(100,totalGasto/totalLim*100):0}%;background:${totalGasto>totalLim?'var(--red)':'var(--brand)'}"></i></div>

function vDividas(){
  const lista = DIVIDAS().map(d=>({d, c:contasDivida(d)}));
  const ativas = lista.filter(x=>!x.c.quitada).sort((a,b)=>a.d.proxima.localeCompare(b.d.proxima));
  const quitadas = lista.filter(x=>x.c.quitada);
  const mensal = ativas.reduce((s,x)=>s+x.c.valor,0);
  const saldo  = ativas.reduce((s,x)=>s+x.c.saldo,0);
  const fim    = ativas.map(x=>x.c.ultima).sort().pop();
  const rec    = receitas(mes);
  const compromisso = rec>0 ? mensal/rec*100 : 0;

  const cartao = ({d,c}) => `
    <div class="card" style="box-shadow:none">
      <div style="display:flex;align-items:start;gap:10px;margin-bottom:12px">
        <div style="flex:1;min-width:0">
          <b>${esc(d.nome)}</b>${c.quitada?' <span class="tag in">quitada</span>':''}
          <div class="hint">${d.credor ? esc(d.credor)+' · ' : ''}${c.total} parcelas de ${fmt(c.valor)}</div>
        </div>
        <div style="white-space:nowrap">
          <button class="btn ghost sm" data-editdiv="${d.id}">✏️</button>
          <button class="btn ghost sm danger" data-deldiv="${d.id}">🗑</button>
        </div>
      </div>

      ${c.quitada ? `<div class="hint">Você pagou as ${c.total} parcelas — ${fmt(c.contratado)} no total.</div>`
      : `
      <div style="display:flex;align-items:baseline;gap:8px">
        <div style="font-size:22px;font-weight:700">${fmt(c.saldo)}</div>
        <div class="hint">ainda a pagar</div>
      </div>
      <div class="hint" style="margin:8px 0 10px">
        Parcela <b>${c.atual}</b> de ${c.total} · faltam ${c.restantes}
      </div>
      <div class="bar"><i style="width:${c.pct}%"></i></div>
      <div class="hint" style="margin-top:8px">${c.pct.toFixed(0)}% pago (${fmt(c.pago)} de ${fmt(c.contratado)})</div>

      <div style="display:flex;gap:10px;margin:14px 0;font-size:13.5px;flex-wrap:wrap">
        <div style="flex:1 1 130px;background:var(--surface-2);border-radius:10px;padding:9px 11px">
          <div class="hint">Próxima parcela</div>
          <b>${dataBR(d.proxima)}</b>
        </div>
        <div style="flex:1 1 130px;background:var(--surface-2);border-radius:10px;padding:9px 11px">
          <div class="hint">Previsão de término</div>
          <b>${dataBR(c.ultima)}</b>
        </div>
      </div>
      <button class="btn sm" data-pagardiv="${d.id}" style="width:100%">✓ Registrar pagamento da parcela ${c.atual}</button>`}
    </div>`;

  return `
  <div class="card" style="margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <div><h3 style="margin:0">Dívidas</h3>
      <div class="hint">Empréstimos, financiamentos e compras parceladas.</div></div>
    <div style="flex:1"></div>
    <button class="btn primary" id="btnNovaDivida">+ Nova dívida</button>
  </div>

  ${ativas.length ? `
  <div class="grid kpis" style="margin-bottom:16px">
    <div class="card kpi">
      <div class="label"><span class="dot" style="background:var(--red)"></span> Saldo devedor</div>
      <div class="value">${fmt(saldo)}</div>
      <div class="foot">${ativas.length} dívida(s) em andamento</div>
    </div>
    <div class="card kpi">
      <div class="label"><span class="dot" style="background:var(--amber)"></span> Compromisso mensal</div>
      <div class="value">${fmt(mensal)}</div>
      <div class="foot">${rec>0 ? compromisso.toFixed(0)+'% das receitas de '+mesLabel(mes) : 'sem receitas lançadas no mês'}</div>
    </div>
    <div class="card kpi">
      <div class="label"><span class="dot" style="background:var(--brand)"></span> Livre de dívidas em</div>
      <div class="value" style="font-size:22px">${mesLongo(fim.slice(0,7))}</div>
      <div class="foot">quando a última parcela cair</div>
    </div>
  </div>` : ''}

  ${lista.length ? `
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">
      ${ativas.map(cartao).join('')}
      ${quitadas.map(cartao).join('')}
    </div>`
  : `<div class="card"><div class="empty"><div class="big">🏦</div>
      Nenhuma dívida cadastrada.<br>
      Cadastre um financiamento ou empréstimo para acompanhar quanto falta e quando termina.
    </div></div>`}`;
}

/* ============================ eventos das views ============================ */
function ligarEventos(){
  $$('[data-goto]').forEach(b=>b.onclick=()=>{ view=b.dataset.goto; render(); });
  const nv=$('#btnNew2'); if(nv) nv.onclick=()=>abrirTx();

  // lançamentos
  const fb=$('#fBusca');
  if(fb) fb.oninput=e=>{ filtros.busca=e.target.value; const p=e.target.selectionStart; render(); const n=$('#fBusca'); n.focus(); n.setSelectionRange(p,p); };
  const ft=$('#fTipo'); if(ft) ft.onchange=e=>{ filtros.tipo=e.target.value; render(); };
  const fc=$('#fCat');  if(fc) fc.onchange=e=>{ filtros.categoria=e.target.value; render(); };
  const fp=$('#fPeriodo'); if(fp) fp.onchange=e=>{ filtros.todos=e.target.value==='todos'; render(); };
  $$('[data-edit]').forEach(b=>b.onclick=()=>abrirTx(S.tx.find(t=>t.id===b.dataset.edit)));
  $$('[data-del]').forEach(b=>b.onclick=()=>{
    const t=S.tx.find(x=>x.id===b.dataset.del);
    if(confirm(`Excluir "${t.descricao}" (${fmt(t.valor)})?`)){
      t.deletado=true; t.atualizado_em=agora(); t._d=true;
      save(); render(); toast('Lançamento excluído');
    }
  });
  const bf=$('#btnFixos'); if(bf) bf.onclick=repetirFixos;
  const bc=$('#btnCSV'); if(bc) bc.onclick=exportarCSV;

  // orçamentos
  $$('[data-budget]').forEach(inp=>inp.onchange=e=>{
    setLimite(inp.dataset.budget, parseFloat(e.target.value)||0);
    save(); render(); toast('Orçamento atualizado');
  });

  // dívidas
  const bnd=$('#btnNovaDivida'); if(bnd) bnd.onclick=()=>abrirDivida();
  $$('[data-editdiv]').forEach(b=>b.onclick=()=>abrirDivida(S.dividas.find(d=>d.id===b.dataset.editdiv)));
  $$('[data-deldiv]').forEach(b=>b.onclick=()=>{
    const d=S.dividas.find(x=>x.id===b.dataset.deldiv);
    if(confirm(`Excluir "${d.nome}"? Os lançamentos já registrados continuam no histórico.`)){
      d.deletado=true; d.atualizado_em=agora(); d._d=true; save(); render(); toast('Dívida excluída');
    }
  });
  $$('[data-pagardiv]').forEach(b=>b.onclick=()=>registrarPagamento(b.dataset.pagardiv));

  // metas
  const bm=$('#btnNovaMeta'); if(bm) bm.onclick=()=>{ $('#formMeta').reset(); $('#dlgMeta').showModal(); };
  $$('[data-delmeta]').forEach(b=>b.onclick=()=>{
    if(confirm('Excluir esta meta?')){
      const g=S.goals.find(x=>x.id===b.dataset.delmeta);
      g.deletado=true; g.atualizado_em=agora(); g._d=true; save(); render();
    }
  });
  $$('[data-depbtn]').forEach(b=>b.onclick=()=>{
    const g=S.goals.find(x=>x.id===b.dataset.depbtn);
    const v=parseFloat($(`[data-dep="${g.id}"]`).value);
    if(!v||v<=0) return toast('Informe um valor válido');
    g.atual=+(g.atual+v).toFixed(2); g.atualizado_em=agora(); g._d=true; save(); render();
    toast(`${fmt(v)} adicionado à meta`);
  });

  // configurações
  $$('[data-addcat]').forEach(b=>b.onclick=()=>{
    const tipo=b.dataset.addcat;
    const inp=$(tipo==='despesa'?'#novaCatDespesa':'#novaCatReceita');
    const v=inp.value.trim();
    if(!v) return;
    if(S.cats[tipo].includes(v)) return toast('Categoria já existe');
    S.cats[tipo].push(v); tocarPrefs(); save(); render(); toast('Categoria adicionada');
  });
  $$('[data-rmcat]').forEach(b=>b.onclick=()=>{
    const [tipo,cat]=b.dataset.rmcat.split('|');
    if(TX().some(t=>t.categoria===cat)) return toast('Existem lançamentos nesta categoria');
    S.cats[tipo]=S.cats[tipo].filter(c=>c!==cat); setLimite(cat,0); tocarPrefs(); save(); render();
  });
  const ac=$('#btnAddConta');
  if(ac) ac.onclick=()=>{
    const v=$('#novaConta').value.trim();
    if(!v || S.contas.includes(v)) return;
    S.contas.push(v); tocarPrefs(); save(); render(); toast('Conta adicionada');
  };
  $$('[data-rmconta]').forEach(b=>b.onclick=()=>{
    S.contas=S.contas.filter(c=>c!==b.dataset.rmconta); tocarPrefs(); save(); render();
  });
  const be=$('#btnExport'); if(be) be.onclick=exportarJSON;
  const bi=$('#btnImport'); if(bi) bi.onclick=()=>$('#fileImport').click();
  const fi=$('#fileImport'); if(fi) fi.onchange=importarJSON;
  const bd=$('#btnDemo'); if(bd) bd.onclick=carregarExemplo;
  const br=$('#btnReset'); if(br) br.onclick=()=>{
    if(confirm('Isso apaga TODOS os dados salvos neste navegador. Continuar?')){
      S=JSON.parse(JSON.stringify(DEFAULTS)); save(); render(); toast('Dados apagados');
    }
  };
  const bt2=$('#btnTheme2'); if(bt2) bt2.onclick=alternarTema;

  // sincronização
  const bsync=$('#btnSbSync'); if(bsync) bsync.onclick=()=>sincronizar(true);
  const bsair=$('#btnSbSair'); if(bsair) bsair.onclick=()=>{
    if(confirm('Sair da conta? Você precisará entrar de novo com e-mail e senha.')) sbSair();
  };
}

/* ============================ lançamentos ============================ */
let tipoAtual='despesa';
function setTipo(t){
  tipoAtual=t;
  $$('#segTipo button').forEach(b=>b.classList.toggle('on', b.dataset.v===t));
  const sel=$('#selCategoria');
  sel.innerHTML=S.cats[t].map(c=>`<option>${esc(c)}</option>`).join('');
}
function abrirTx(t){
  const f=$('#formTx'); f.reset();
  $('#selConta').innerHTML='<option value="">—</option>'+S.contas.map(c=>`<option>${esc(c)}</option>`).join('');
  setTipo(t?t.tipo:'despesa');
  $('#dlgTxTitle').textContent = t ? 'Editar lançamento' : 'Novo lançamento';
  f.id.value = t?t.id:'';
  f.valor.value = t?t.valor:'';
  f.data.value = t?t.data:(mes===todayISO().slice(0,7)?todayISO():mes+'-01');
  f.descricao.value = t?t.descricao:'';
  f.fixo.checked = t?!!t.fixo:false;
  if(t){ f.categoria.value=t.categoria; f.conta.value=t.conta||''; }
  $('#dlgTx').showModal();
  setTimeout(()=>f.valor.focus(),50);
}
$('#formTx').addEventListener('submit', e=>{
  if(e.submitter && e.submitter.value==='cancel') return;
  const f=e.target, d=Object.fromEntries(new FormData(f));
  const tx={
    id: d.id || uid(),
    tipo: tipoAtual,
    valor: Math.abs(parseFloat(d.valor)||0),
    data: d.data,
    descricao: d.descricao.trim(),
    categoria: d.categoria,
    conta: d.conta || '',
    fixo: !!d.fixo,
    deletado: false,
    atualizado_em: agora(),
    _d: true
  };
  if(d.id) S.tx=S.tx.map(t=>t.id===d.id?tx:t); else S.tx.push(tx);
  save();
  if(tx.data.slice(0,7)!==mes && !filtros.todos){ mes=tx.data.slice(0,7); }
  render(); toast(d.id?'Lançamento atualizado':'Lançamento salvo');
});
$$('#segTipo button').forEach(b=>b.onclick=()=>setTipo(b.dataset.v));

function abrirDivida(d){
  const f=$('#formDivida'); f.reset();
  $('#dlgDividaTitulo').textContent = d ? 'Editar dívida' : 'Nova dívida';
  f.id.value      = d ? d.id : '';
  f.nome.value    = d ? d.nome : '';
  f.credor.value  = d ? (d.credor||'') : '';
  f.parcela.value = d ? d.parcela : '';
  f.atual.value   = d ? d.atual : 1;
  f.total.value   = d ? d.total : '';
  f.proxima.value = d ? d.proxima : todayISO();
  f.lancar.checked = d ? d.lancar !== false : true;
  $('#dlgDivida').showModal();
  setTimeout(()=>f.nome.focus(),50);
}

$('#formDivida').addEventListener('submit', e=>{
  if(e.submitter && e.submitter.value==='cancel') return;
  const d = Object.fromEntries(new FormData(e.target));
  const total = Math.max(1, parseInt(d.total)||1);
  const atual = Math.min(total+1, Math.max(1, parseInt(d.atual)||1));
  const divida = {
    id: d.id || uid(),
    nome: d.nome.trim(),
    credor: (d.credor||'').trim(),
    parcela: Math.abs(parseFloat(d.parcela)||0),
    atual, total,
    proxima: d.proxima,
    lancar: !!d.lancar,
    deletado: false,
    atualizado_em: agora(),
    _d: true
  };
  if(d.id) S.dividas = S.dividas.map(x => x.id===d.id ? divida : x);
  else S.dividas.push(divida);
  save(); render();
  toast(d.id ? 'Dívida atualizada' : 'Dívida cadastrada');
});

function registrarPagamento(id){
  const d = S.dividas.find(x=>x.id===id);
  const c = contasDivida(d);
  const vaiLancar = d.lancar !== false;
  const aviso = `Registrar o pagamento da parcela ${c.atual} de ${c.total} (${fmt(c.valor)})?` +
                (vaiLancar ? '\n\nUma despesa será lançada em ' + dataBR(d.proxima) + '.' : '');
  if(!confirm(aviso)) return;

  if(vaiLancar){
    if(!S.cats.despesa.includes('Dívidas')){ S.cats.despesa.push('Dívidas'); tocarPrefs(); }
    S.tx.push({
      id: uid(), tipo:'despesa', valor: c.valor, data: d.proxima,
      categoria: 'Dívidas', descricao: `${d.nome} — parcela ${c.atual}/${c.total}`,
      conta: '', fixo: false, deletado:false, atualizado_em: agora(), _d: true
    });
  }
  d.atual = c.atual + 1;
  if(d.atual <= c.total) d.proxima = dataMaisMeses(d.proxima, 1);
  d.atualizado_em = agora(); d._d = true;
  save(); render();
  toast(d.atual > c.total ? 'Dívida quitada! 🎉' : `Parcela ${c.atual} registrada`);
}

$('#formMeta').addEventListener('submit', e=>{
  if(e.submitter && e.submitter.value==='cancel') return;
  const d=Object.fromEntries(new FormData(e.target));
  S.goals.push({ id:uid(), nome:d.nome.trim(), alvo:parseFloat(d.alvo)||0, atual:parseFloat(d.atual)||0,
                 prazo:d.prazo||'', deletado:false, atualizado_em:agora(), _d:true });
  save(); render(); toast('Meta criada');
});

function repetirFixos(){
  const fixos=TX().filter(t=>t.fixo);
  const vistos=new Set(), novos=[];
  fixos.sort((a,b)=>b.data.localeCompare(a.data)).forEach(t=>{
    const chave=t.tipo+'|'+t.descricao.toLowerCase()+'|'+t.categoria;
    if(vistos.has(chave)) return;
    vistos.add(chave);
    const jaTem=doMes(mes).some(x=>x.tipo===t.tipo && x.descricao.toLowerCase()===t.descricao.toLowerCase() && x.categoria===t.categoria);
    if(jaTem) return;
    const dia=Math.min(+t.data.slice(8,10), new Date(+mes.slice(0,4), +mes.slice(5,7), 0).getDate());
    novos.push({...t, id:uid(), data:`${mes}-${String(dia).padStart(2,'0')}`, atualizado_em:agora(), _d:true});
  });
  if(!novos.length) return toast('Nada a repetir: fixos já lançados neste mês');
  S.tx.push(...novos); save(); render();
  toast(`${novos.length} lançamento(s) fixo(s) criado(s)`);
}

/* ============================ dados: import / export ============================ */
function baixar(nome, conteudo, tipo){
  const url=URL.createObjectURL(new Blob([conteudo],{type:tipo}));
  const a=document.createElement('a'); a.href=url; a.download=nome; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportarJSON(){
  baixar(`financas-${todayISO()}.json`, JSON.stringify(S,null,2), 'application/json');
  toast('Backup exportado');
}
function exportarCSV(){
  const linhas=[['Data','Tipo','Descrição','Categoria','Conta','Valor']];
  TX().sort((a,b)=>a.data.localeCompare(b.data)).forEach(t=>{
    linhas.push([t.data, t.tipo, t.descricao, t.categoria, t.conta||'', String(t.valor).replace('.',',')]);
  });
  const csv='﻿'+linhas.map(l=>l.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  baixar(`financas-${todayISO()}.csv`, csv, 'text/csv;charset=utf-8');
  toast('CSV exportado');
}
function importarJSON(e){
  const file=e.target.files[0]; if(!file) return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const d=JSON.parse(fr.result);
      if(!Array.isArray(d.tx)) throw new Error('formato inválido');
      if(!confirm(`Importar ${d.tx.length} lançamento(s)? Os dados atuais serão substituídos.`)) return;
      S=normalizar(Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), d));
      save(); aplicarTema(); render(); toast('Dados importados');
    }catch(err){ alert('Arquivo inválido: '+err.message); }
    e.target.value='';
  };
  fr.readAsText(file);
}

/* ============================ sincronização (Supabase) ============================ */
const SB = {
  get url(){ return (localStorage.getItem('sb-url') || SUPABASE.url || '').replace(/\/+$/,''); },
  get key(){ return localStorage.getItem('sb-key') || SUPABASE.key || ''; },
  get sess(){ try{ return JSON.parse(localStorage.getItem('sb-session')||'null'); }catch(e){ return null; } },
  set sess(v){ v ? localStorage.setItem('sb-session', JSON.stringify(v)) : localStorage.removeItem('sb-session'); },
  get last(){ return localStorage.getItem('sb-last')||'1970-01-01T00:00:00+00:00'; },
  set last(v){ localStorage.setItem('sb-last', v); },
  configurar(url,key){ localStorage.setItem('sb-url',url.trim()); localStorage.setItem('sb-key',key.trim()); },
  configurado(){ return !!(this.url && this.key) && this.key.indexOf('__') !== 0; },
  ligado(){ return this.configurado() && !!this.sess; },
  email(){ return (this.sess && this.sess.user && this.sess.user.email) || localStorage.getItem('sb-email') || ''; }
};
const TABELAS = [
  { nome:'transacoes', chave:'tx',      pk:['id'] },
  { nome:'metas',      chave:'goals',   pk:['id'] },
  { nome:'orcamentos', chave:'budgets', pk:['categoria'] },
  /* opcional: quem criou o banco antes da aba de dívidas ainda não tem esta tabela.
     Enquanto ela não existir, o app funciona e guarda as dívidas só no aparelho. */
  { nome:'dividas',    chave:'dividas', pk:['id'], opcional:true }
];
let avisouTabela = false;
let statusSync = 'off', timerSync = null;

function pendentes(){
  return TABELAS.reduce((n,t)=> n + S[t.chave].filter(r=>r._d).length, 0) + (S.prefsDirty?1:0);
}
function setStatus(st){
  statusSync = st;
  const p = $('#pillSync'); if(!p) return;
  const map = { off:['☁','Sincronização desativada — configure em Configurações',''],
                ok:['☁','Tudo sincronizado','ok'],
                pend:['⏳','Alterações pendentes de envio','pend'],
                sync:['⟳','Sincronizando...',''],
                erro:['⚠','Falha na última sincronização — clique para tentar de novo','erro'] };
  const info = map[st] || map.off;
  p.textContent = info[0]; p.title = info[1]; p.className = 'btn ' + info[2];
}
function tocarPrefs(){ S.prefsAt = agora(); S.prefsDirty = true; }
function agendarSync(){
  if(!SB.ligado()){ setStatus('off'); return; }
  if(pendentes()) setStatus('pend');
  clearTimeout(timerSync);
  timerSync = setTimeout(()=>sincronizar(), 2500);
}

async function sbFetch(caminho, opts={}){
  const h = Object.assign({ apikey: SB.key, 'Content-Type':'application/json' }, opts.headers||{});
  if(SB.sess && !opts.semAuth) h.Authorization = 'Bearer ' + SB.sess.access_token;
  const r = await fetch(SB.url + caminho, {...opts, headers:h});
  if(r.status===401 && SB.sess && SB.sess.refresh_token && !opts._retry){
    await renovarSessao();
    return sbFetch(caminho, {...opts, _retry:true});
  }
  if(!r.ok){
    let msg = await r.text();
    try{ const j=JSON.parse(msg); msg = j.message || j.error_description || j.msg || j.hint || msg; }catch(e){}
    throw new Error(String(msg).slice(0,180));
  }
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}
async function renovarSessao(){
  const r = await fetch(SB.url+'/auth/v1/token?grant_type=refresh_token', {
    method:'POST', headers:{apikey:SB.key,'Content-Type':'application/json'},
    body: JSON.stringify({refresh_token: SB.sess.refresh_token})
  });
  if(!r.ok){ SB.sess=null; setStatus('erro'); throw new Error('sessão expirada — entre novamente'); }
  SB.sess = await r.json();
}
async function sbEntrar(email, senha, criar){
  const caminho = criar ? '/auth/v1/signup' : '/auth/v1/token?grant_type=password';
  const d = await sbFetch(caminho, {method:'POST', semAuth:true, body:JSON.stringify({email, password:senha})});
  if(!d || !d.access_token) throw new Error('confirme o e-mail recebido e depois entre normalmente');
  const anterior = localStorage.getItem('sb-email');
  if(anterior && anterior !== email) zerarLocal();   // conta diferente: não mistura dados
  SB.sess = d;
  localStorage.setItem('sb-email', email);
  SB.last = '1970-01-01T00:00:00+00:00';
  TABELAS.forEach(t=>S[t.chave].forEach(r=>{ r._d = true; }));
  S.prefsDirty = true; save0();
  await sincronizar(true);
}
function zerarLocal(){
  const tema = S.theme;
  S = JSON.parse(JSON.stringify(DEFAULTS));
  S.theme = tema; save0();
}
function sbSair(){
  SB.sess = null;
  SB.last = '1970-01-01T00:00:00+00:00';
  localStorage.removeItem('sb-syncedAt');
  zerarLocal();
  setStatus('off');
  render();
}

function paraRemoto(r){
  const o = {...r};
  delete o._d;
  o.user_id = SB.sess.user.id;
  if(o.prazo === '') o.prazo = null;
  if(o.conta === '') o.conta = null;
  return o;
}
function paraLocal(r){
  delete r.user_id;
  if(r.prazo === null) r.prazo = '';
  if(r.conta === null) r.conta = '';
  ['valor','alvo','atual','limite'].forEach(k=>{ if(r[k]!==undefined && r[k]!==null) r[k]=+r[k]; });
  return r;
}
const mesmaChave = (t,a,b) => t.pk.every(k => a[k] === b[k]);

async function empurrar(t){
  const sujos = S[t.chave].filter(r=>r._d);
  if(!sujos.length) return 0;
  await sbFetch('/rest/v1/'+t.nome, {
    method:'POST',
    headers:{ Prefer:'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify(sujos.map(paraRemoto))
  });
  sujos.forEach(r=>{ delete r._d; });
  return sujos.length;
}
async function puxar(t){
  const linhas = await sbFetch('/rest/v1/'+t.nome+'?select=*&atualizado_em=gt.'+encodeURIComponent(SB.last));
  let maior = SB.last, n = 0;
  (linhas||[]).forEach(bruta=>{
    const r = paraLocal(bruta);
    if(r.atualizado_em > maior) maior = r.atualizado_em;
    const arr = S[t.chave], i = arr.findIndex(x=>mesmaChave(t,x,r));
    if(i < 0){ arr.push(r); n++; }
    else if(!arr[i]._d && (arr[i].atualizado_em||'') < r.atualizado_em){ arr[i] = r; n++; }
  });
  return {n, maior};
}
async function sincronizarPrefs(){
  let n = 0;
  if(S.prefsDirty){
    await sbFetch('/rest/v1/preferencias', {
      method:'POST', headers:{ Prefer:'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify([{ user_id:SB.sess.user.id, dados:{cats:S.cats, contas:S.contas}, atualizado_em:S.prefsAt||agora() }])
    });
    S.prefsDirty = false;
  } else {
    const linhas = await sbFetch('/rest/v1/preferencias?select=*');
    const p = (linhas||[])[0];
    if(p && (S.prefsAt||'') < p.atualizado_em && p.dados){
      if(p.dados.cats) S.cats = p.dados.cats;
      if(p.dados.contas) S.contas = p.dados.contas;
      S.prefsAt = p.atualizado_em; n++;
    }
  }
  return n;
}
async function sincronizar(manual){
  if(!SB.ligado()){ setStatus('off'); return; }
  if(!navigator.onLine){ setStatus(pendentes()?'pend':'off'); if(manual) toast('Sem conexão — enviarei quando voltar'); return; }
  if(statusSync === 'sync') return;
  setStatus('sync');
  try{
    let mudou = 0, maior = SB.last;
    /* uma tabela opcional que ainda não existe no banco não pode derrubar a sincronização */
    const tolerar = async (t, fn) => {
      try{ return await fn(); }
      catch(e){
        if(t.opcional && /(does not exist|find the table|schema cache|PGRST205|PGRST20[0-9])/i.test(e.message)){
          if(!avisouTabela){ avisouTabela = true; console.warn('tabela ausente no banco:', t.nome, '— rode supabase.sql de novo'); }
          return null;
        }
        throw e;
      }
    };
    for(const t of TABELAS) mudou += await tolerar(t, ()=>empurrar(t)) || 0;
    for(const t of TABELAS){
      const r = await tolerar(t, ()=>puxar(t));
      if(r){ mudou += r.n; if(r.maior > maior) maior = r.maior; }
    }
    mudou += await sincronizarPrefs();
    SB.last = maior;
    limparLixeira();
    save0(); localStorage.setItem('sb-syncedAt', agora()); setStatus('ok');
    if(mudou || manual) render();
    if(manual) toast('Sincronizado');
  }catch(e){
    setStatus('erro');
    if(manual) toast('Falha: ' + e.message); else console.warn('sync:', e.message);
  }
}
/* descarta localmente as lápides já sincronizadas há mais de 60 dias */
function limparLixeira(){
  const limite = new Date(Date.now() - 60*864e5).toISOString();
  TABELAS.forEach(t=>{ S[t.chave] = S[t.chave].filter(r=> !(r.deletado && !r._d && (r.atualizado_em||'') < limite)); });
}

/* ============================ tema e inicialização ============================ */
function aplicarTema(){
  document.documentElement.dataset.theme=S.theme;
  $('#btnTheme').textContent = S.theme==='dark' ? '☀️' : '🌙';
}
function alternarTema(){
  S.theme = S.theme==='dark' ? 'light' : 'dark';
  save(); aplicarTema(); render();
}
$('#btnTheme').onclick=alternarTema;
$('#btnNew').onclick=()=>abrirTx();
$('#mesRef').onchange=e=>{ mes=e.target.value||mes; render(); };
$('#mesPrev').onclick=()=>{ mes=addMes(mes,-1); render(); };
$('#mesNext').onclick=()=>{ mes=addMes(mes,1); render(); };
$$('#tabs button').forEach(b=>b.onclick=()=>{ view=b.dataset.view; render(); });
window.addEventListener('resize', ()=>{ if(view==='dashboard') render(); });
document.addEventListener('keydown', e=>{
  if(e.key==='n' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && !$('#dlgTx').open){
    e.preventDefault(); abrirTx();
  }
});

$('#pillSync').onclick = () => { if(SB.ligado()) sincronizar(true); else { view='config'; render(); } };
window.addEventListener('online',  ()=>sincronizar());
window.addEventListener('offline', ()=>setStatus(pendentes()?'pend':'off'));
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) sincronizar(); });

aplicarTema();
render();
setStatus(SB.ligado() ? (pendentes()?'pend':'ok') : 'off');
if(SB.ligado()) sincronizar();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
